name: ci

# Two hard gates: the aggregate must be drift-free, and the eviction template
# must pass its own assertions. Both are pure stdlib, so CI adds no install cost.
on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1  # v7.0.1

      - uses: actions/setup-python@6d4fd22b20465ccc0f7354476588e8df7c9ca0e0  # v7.1.0
        with:
          python-version: '3.12'

      - name: llms-full.txt has zero drift
        run: python3 scripts/build-llms-full.py --check

      - name: memory_eviction self-test
        run: python3 templates/memory_eviction.py --self-test